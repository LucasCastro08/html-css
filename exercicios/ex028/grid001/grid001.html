<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>

    <style>
        * {
            margin: 0px;
            padding: 0px;
            overflow: hidden;
        }

        div#container {
            width: 100vw;
            height: 100vh;
            border: 1px solid black;
            
            display: grid;
            gap: 5px;

            grid-template: 80px 40px 1fr 40px / 1fr 150px;
        }

        div.topo {
            border: 2px dotted red;
            text-align: center;

            grid-area: 1 / 1 / 2 / -1 ;
        }

        div.rodape {
            border: 2px dotted red;
            text-align: center;

            grid-area: -2 / 1 / -1 / -1;
        }

        div.principal {
            border: 2px dotted red;
            text-align: center;

            grid-area: 3 / 1 / 4 / 2;
        }

        div.secundario {
            border: 2px dotted red;
            text-align: center;

            grid-area: 3 / 2 / -2 / -1;
        }

        div.menu {
            border: 2px dotted red;
            text-align: center;

            grid-area: 2 / 1 / 3 / -1;
        }

    </style>
</head>
<body>
    <div id="container">
        <div class="topo">Topo</div>
        <div class="menu">Menu</div>
        <div class="principal">Principal</div>
        <div class="secundario">Secundario</div>
        <div class="rodape">Rodapé</div>
    </div>
</body>
</html>
